plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    // IMPORTANT: Keep namespace and applicationId as mtp.media.karaoke if using prebuilt libAudioEngine.so
    // because JNI methods (Java_mtp_media_karaoke_*) are statically registered to this package name.
    namespace 'mtp.media.karaoke'
    compileSdk 34

    defaultConfig {
        applicationId "mtp.media.karaoke"
        minSdk 21
        targetSdk 33
        versionCode 46
        versionName "2.1.0"

        multiDexEnabled true

        // Configurable API & Web URLs injected into BuildConfig
        buildConfigField "String", "API_BASE_URL", "\"https://api.karavietnam.com/\""
        buildConfigField "String", "WEB_BASE_URL", "\"https://www.karavietnam.com\""
        buildConfigField "String", "SUPPORT_URL", "\"http://m.me/296638503839388\""

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // AndroidX Core & UI
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Room Local Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Koin Dependency Injection
    implementation 'io.insert-koin:koin-android:3.5.3'

    // Networking: Retrofit 2 + OkHttp 4 + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Media & Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    // EventBus & Permissions
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'pub.devrel:easypermissions:3.0.0'

    // Firebase, Google Sign-In, Facebook Login, AdMob & Play Billing
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    implementation 'com.google.firebase:firebase-analytics:21.5.1'
    implementation 'com.google.firebase:firebase-crashlytics:18.6.2'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.facebook.android:facebook-login:16.3.0'
    implementation 'com.android.billingclient:billing-ktx:6.1.0'
}
